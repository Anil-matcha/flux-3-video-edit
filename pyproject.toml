[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-3-video-edit-api"
version = "0.2.0"
authors = [
  { name="Anil Matcha" },
]
description = "Python wrapper for FLUX 3 Video Extend -- continues an existing video clip with new prompt-guided motion and scene development, via muapi.ai."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "python-dotenv",
    "mcp[cli]"
]

[tool.setuptools]
py-modules = ["flux3_video_edit_api", "mcp_server"]
